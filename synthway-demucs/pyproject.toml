# Demucs for Synthway's Decomposer, in its own environment (uv sync): the
# server never imports torch, it runs separate.py with this environment's Python.
[project]
name = "synthway-demucs"
version = "0.1.0"
description = "Music source separation (Demucs v4) for Synthway's Decomposer"
requires-python = ">=3.10,<3.14"
dependencies = [
    "demucs",
    # Demucs reads the audio through sphn into numpy arrays, without declaring it
    "numpy",
    "torch>=2.7",
]

[tool.uv]
package = false
# A Python of uv's own: the MSYS2 one has no torch wheels
python-preference = "only-managed"
# Synthway's platforms only (demucs pins an old torch on Intel macOS)
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.uv.sources]
demucs = { path = "vendor/demucs" }
# CUDA 13.0 build on Windows (Blackwell cards need 12.8 at least); PyPI's elsewhere
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
