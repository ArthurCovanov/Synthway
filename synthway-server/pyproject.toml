[build-system]
# 77: first version that reads `license` as an SPDX expression (PEP 639)
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthway-server"
version = "0.3.1"
description = "FastAPI & WebSocket backend orchestrator for Synthway audio engine"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Synthway Team" }]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
synthway-server = "synthway_server.main:start"

# The code lives in src/ but is installed as the `synthway_server` package
[tool.setuptools]
package-dir = { "synthway_server" = "src" }
packages = ["synthway_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
